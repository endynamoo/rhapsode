name: linux

# The Linux source install, exercised on a clean machine: the unit suite, then a
# real server started the way the README says, asked for /api/health, with
# Tesseract as the OCR backend and remote access confirmed off. No packaging
# yet - see docs/PLATFORMS.md.

on:
  push:
    branches: [main, testing, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run the suite
        run: python -m unittest discover -s tests -v

  run:
    name: run (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg and Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Install the reader
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the server and ask it for health
        shell: bash
        run: |
          export MURMUR_HOME="$(mktemp -d)"
          export MURMUR_PORT=8899
          python -m murmur > server.log 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 60); do
            sleep 2
            if health="$(curl -fsS http://127.0.0.1:8899/api/health 2>/dev/null)"; then
              ok="$health"
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          if [ -z "$ok" ]; then
            echo "the server did not answer /api/health" >&2
            tail -60 server.log >&2 || true
            exit 1
          fi
          python - "$ok" <<'PY'
          import json, sys

          health = json.loads(sys.argv[1])
          print(f"health ok={health['ok']} ocr={health['ocr']} backend={health['ocrBackend']}")
          problems = []
          if not health.get("ok"):
              problems.append("health.ok is false")
          if not health.get("ocr"):
              problems.append(f"OCR unavailable (backend {health.get('ocrBackend')!r})")
          if health.get("ocrBackend") != "tesseract":
              problems.append(f"expected the tesseract backend, got {health.get('ocrBackend')!r}")
          if problems:
              raise SystemExit("; ".join(problems))
          PY
          network="$(curl -fsS http://127.0.0.1:8899/api/network)"
          python - "$network" <<'PY'
          import json, sys

          network = json.loads(sys.argv[1])
          print(f"network enabled={network['enabled']} remoteAccess={network['remoteAccess']}")
          if network.get("enabled") or network.get("remoteAccess"):
              raise SystemExit("remote access must stay off by default")
          PY
          kill "$pid" 2>/dev/null || true
          tail -5 server.log || true
