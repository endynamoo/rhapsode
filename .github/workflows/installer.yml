name: installer

# A clean Windows machine for free: build the app, build the installer, install it
# into a temporary directory with a temporary data home, check the layout and the
# engine script, start it, ask it for /api/health, uninstall.
#
# The GPU is not available on a runner, so the stills engine is exercised with
# -SkipWeights -DryRun. Everything else - Inno packaging, the shipped scripts, the
# install/uninstall cycle, the app coming up - is real.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/setup_engine.ps1"
      - "scripts/build_installer.ps1"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: build + install (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build the app and the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_installer.ps1

      - name: Install it into a temporary directory
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rh'
          $app = Join-Path $root 'app'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          $setup = Get-ChildItem dist -Filter 'Rhapsode-*-Setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$app" -Wait
          $exe = Join-Path $app 'Rhapsode.exe'
          if (-not (Test-Path $exe)) { throw "no Rhapsode.exe in $app" }
          $script = Join-Path $app 'scripts\setup_engine.ps1'
          if (-not (Test-Path $script)) { throw 'the engine script was not shipped' }
          "installed $(Get-Item $exe).LastWriteTime -> $((Get-Item $exe).Length) bytes"

      - name: The engine script runs and writes a profile
        shell: powershell
        run: |
          $env:MURMUR_HOME = Join-Path $env:RUNNER_TEMP 'rh\data'
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\rh\app\scripts\setup_engine.ps1" -Profile cpu -SkipWeights -DryRun
          if ($LASTEXITCODE) { throw "setup_engine.ps1 exited $LASTEXITCODE" }

      - name: The installed app answers /api/health
        shell: powershell
        run: |
          $env:MURMUR_HOME = Join-Path $env:RUNNER_TEMP 'rh\data'
          New-Item -ItemType Directory -Force -Path $env:MURMUR_HOME | Out-Null
          $exe = Join-Path $env:RUNNER_TEMP 'rh\app\Rhapsode.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--port','8877' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod 'http://127.0.0.1:8877/api/health' -TimeoutSec 3
              if ($health.ok) { $ok = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          if (-not $ok) {
            $log = Join-Path $env:MURMUR_HOME 'app.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw 'the installed app did not report healthy'
          }
          "health ok: profile=$($health.profile.name) ocr=$($health.ocr)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Uninstall
        shell: powershell
        run: |
          $uninst = Join-Path $env:RUNNER_TEMP 'rh\app\unins000.exe'
          if (-not (Test-Path $uninst)) { throw 'no uninstaller' }
          Start-Process -FilePath $uninst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'rh\app\Rhapsode.exe')) { throw 'the app survived uninstall' }
          'uninstalled cleanly'
